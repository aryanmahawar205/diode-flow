syntax = "proto3";

package diode.proto;

// TransferManifest: Complete metadata for a file transfer
message TransferManifest {
  string transfer_id = 1;              // UUID4, unique per transfer
  string sender_node_id = 2;           // Identifier of sending node
  string protocol_version = 3;         // e.g., "1.0.0"
  string file_name = 4;                // Original filename
  int64 file_size = 5;                 // Bytes
  string file_sha256 = 6;              // Hex SHA-256 hash
  int32 chunk_size = 7;                // Bytes per chunk
  int32 total_chunks = 8;              // K (original chunks)
  int32 rs_n = 9;                      // Reed-Solomon n (total)
  int32 rs_k = 10;                     // Reed-Solomon k (parity)
  int32 num_passes = 11;               // Fountain encoding passes
  float overhead_ratio = 12;           // Per-pass overhead fraction
  int32 interleave_depth = 13;         // Packet reordering depth
  int64 window_size_bytes = 14;        // Bytes per window
  int32 total_windows = 15;            // Number of windows
  string merkle_root = 16;             // Hex Merkle root of all chunks
  string mime_type = 17;               // File MIME type
  double creation_timestamp = 18;      // Unix epoch timestamp
  string classification_level = 19;    // "standard" | "critical" | "classified"
  int32 expiration_policy = 20;        // Seconds after which invalid
  bytes ed25519_signature = 21;        // Ed25519 signature over fields 1-20
  string compression_algorithm = 22;   // "lz4" | "none"
  int64 compressed_size = 23;          // bytes after compression
  int64 original_size = 24;            // bytes before compression
  string original_sha256 = 25;         // hex SHA-256 of original file
}

// WindowManifest: Per-window metadata
message WindowManifest {
  string transfer_id = 1;              // Links to parent TransferManifest
  int32 window_id = 2;                 // 0-indexed window number
  int64 window_offset = 3;             // Byte offset in original file
  int64 window_size = 4;               // Actual bytes in this window
  int32 chunk_count = 5;               // K_window (before RS)
  int32 chunk_count_with_rs = 6;       // K_window + parity (for fountain)
  int32 padding_length = 7;            // Zero-padding bytes in last chunk
  string window_merkle_root = 8;       // Merkle root for this window only
}
